[build]
  command = "npm run build"
  publish = "dist"

# Fonts, scripts and styles have hashed filenames, so they can be cached for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/film/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
